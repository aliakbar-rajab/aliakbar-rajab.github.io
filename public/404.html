<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>صفحه پیدا نشد | بنیان فولاد داریا</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background: #f6f6f7;
        color: #222226;
        font-family: Tahoma, Arial, sans-serif;
      }
      .shell {
        width: min(100% - 2.5rem, 72rem);
        margin: auto;
      }
      .site-header {
        border-bottom: 1px solid #dedee2;
        background: #fff;
      }
      .header-inner,
      .footer-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.25rem;
      }
      .header-inner {
        min-height: 5.5rem;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        color: inherit;
        font-weight: 800;
        text-decoration: none;
      }
      .brand img {
        width: 3.75rem;
        height: 3.75rem;
        object-fit: contain;
      }
      .brand span {
        display: grid;
        gap: 0.1rem;
      }
      .brand small {
        color: #65656c;
        font-size: 0.7rem;
        font-weight: 400;
      }
      .header-nav,
      .not-found-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }
      .header-nav a {
        color: #3b3b3e;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
      }
      main {
        min-height: calc(100vh - 14rem);
        display: grid;
        place-items: center;
        padding-block: 3rem;
      }
      .not-found-card {
        width: min(100%, 38rem);
        padding: clamp(2rem, 7vw, 4rem);
        border-radius: 14px;
        background: #3b3b3e;
        color: #fff;
        box-shadow: 0 18px 50px rgb(18 18 22 / 18%);
        text-align: center;
      }
      h1 {
        margin: 0;
        color: #f6b500;
      }
      .not-found-actions a {
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
        padding-inline: 1rem;
        border-radius: 8px;
        background: #f6b500;
        color: #222226;
        font-weight: 700;
        text-decoration: none;
      }
      .site-footer {
        padding-block: 1.5rem;
        background: #242428;
        color: #f2f2f4;
      }
      .footer-inner {
        min-height: 4rem;
      }
      .footer-inner p {
        margin: 0;
        color: #d4d4d7;
        font-size: 0.85rem;
      }
      .footer-inner nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }
      .footer-inner a {
        color: #f2f2f4;
        font-size: 0.85rem;
        text-decoration: none;
      }
      @media (max-width: 640px) {
        .header-inner,
        .footer-inner {
          align-items: center;
          flex-direction: column;
          justify-content: center;
          padding-block: 1rem;
          text-align: center;
        }
        .header-nav {
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="/" aria-label="بنیان فولاد داریا، صفحه اصلی">
          <img src="brand/bonyan-foulad-daria-logo.png" alt="" width="1254" height="1254" />
          <span>بنیان فولاد داریا<small>BONYAN FOULAD DARIA</small></span>
        </a>
        <nav class="header-nav" aria-label="ناوبری اصلی">
          <a href="/#products">محصولات</a>
          <a href="/#prices">قیمت‌های روز</a>
          <a href="/contact/">تماس با ما</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="not-found-card" aria-labelledby="not-found-title">
        <h1 id="not-found-title">این صفحه پیدا نشد</h1>
        <p>نشانی واردشده وجود ندارد یا جابه‌جا شده است.</p>
        <nav class="not-found-actions" aria-label="مسیرهای پیشنهادی">
          <a href="/">صفحه اصلی</a>
          <a href="/#products">محصولات فولادی</a>
          <a href="/contact/">تماس با ما</a>
        </nav>
      </section>
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>معرفی و استعلام مقاطع فولادی برای پروژه‌های ساختمانی و صنعتی</p>
        <nav aria-label="پیوندهای پایانی">
          <a href="/quote-process/">درخواست پیش‌فاکتور</a>
          <a href="/complaints/">ثبت شکایت و پیگیری</a>
          <a href="/privacy/">حریم خصوصی</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
