<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>صفحه پیدا نشد | بنیان فولاد داریا</title>
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 1rem;
        background: #3b3b3e;
        color: #fff;
        font-family: Tahoma, sans-serif;
        text-align: center;
      }
      main {
        max-width: 34rem;
      }
      h1 {
        color: #f6b500;
      }
      a {
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
        padding-inline: 1rem;
        border-radius: 8px;
        background: #f6b500;
        color: #222226;
        font-weight: 700;
        text-decoration: none;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>این صفحه پیدا نشد</h1>
      <p>نشانی واردشده وجود ندارد یا جابه‌جا شده است.</p>
      <nav aria-label="مسیرهای پیشنهادی">
        <a href="/">صفحه اصلی</a>
        <a href="/#products">محصولات فولادی</a>
        <a href="/contact/">تماس با ما</a>
      </nav>
    </main>
  </body>
</html>
